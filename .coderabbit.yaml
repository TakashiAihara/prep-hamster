# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja-JP
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!bun.lock"
    - "!packages/db/drizzle/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
chat:
  auto_reply: true
