name: Mobile E2E

# Runs the Maestro flows on an Android emulator against Supabase local + the API started in the job
# (apps/user/client/mobile/scripts/e2e.ts). No secrets: every run starts from an empty local DB.
on:
  pull_request:
    paths:
      - "apps/user/client/mobile/**"
      - "apps/core/api/**"
      - "packages/**"
      - "supabase/**"
      - "bun.lock"
      - "package.json"
      - "bunfig.toml"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    name: Maestro flows (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile

      # JS-only changes keep the native fingerprint, so most runs reuse the APK and skip gradle
      - name: Compute the APK cache key
        id: fingerprint
        run: echo "key=$(bun run apps/user/client/mobile/scripts/e2e.ts fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/e2e/app-debug-*.apk
          key: e2e-apk-${{ steps.fingerprint.outputs.key }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Build before the emulator boots: both at once starve the runner's CPUs
      - name: Build the debug APK
        run: bun run apps/user/client/mobile/scripts/e2e.ts build

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.5.1
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The runner executes each script line separately; keep it one line
          script: E2E_DEVICE=emulator-5554 bun run apps/user/client/mobile/scripts/e2e.ts

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e
          path: |
            docs/design/screens-as-is/
            docs/design/screens-as-is.md
            .cache/e2e/*.log
          if-no-files-found: warn
