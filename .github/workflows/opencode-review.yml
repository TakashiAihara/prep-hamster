name: opencode-review

# Reviews each PR with opencode on two free Zen models, each job naming its model. The review
# steps live in TakashiAihara/opencode-review; @main follows changes made there.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  opencode:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TakashiAihara/opencode-review/.github/workflows/review.yml@main
    with:
      # Zen free tier, zero retention and not used for training (opencode Zen docs, 2026-11-19).
      # Free models are withdrawn without notice; that shows as this job failing.
      model: opencode/deepseek-v4.1-flash-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  # A second free Zen model: in two replays of a PR with two known bugs it found 3 of 4,
  # glm-5.3-flash-free (then used by the job above, withdrawn 2026-11-18) 1 of 4, and the two
  # together all 4 (2026-11-10).
  opencode-inkling:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: TakashiAihara/opencode-review/.github/workflows/review.yml@main
    with:
      model: opencode/inkling-2-small-free
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
