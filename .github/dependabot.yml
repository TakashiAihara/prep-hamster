version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Expo の SDK が版を固定するパッケージは単独で上げると mobile の build が壊れ、CI の
    # typecheck / test では検出できない。SDK の更新で `bunx expo install --fix` に揃える (#119)。
    # versions を書かない ignore は security update を止めない (dependabot-core の
    # IgnoreCondition#ignored_versions は security update では versions だけを返す)。
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/*"
      # 型検査は tsgo (@typescript/native-preview) で行い、`typescript` を読むのは Expo の CLI
      # (tsconfig の評価) だけ。TypeScript 7 は Expo の CLI が使う JS API を持たず、mobile の
      # bundle が作れなくなる (#25 で上げて壊れた)。Expo が 7 に対応するまで major は上げない。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      bun-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
