# 起動 → 在庫一覧 (空) → 追加タブ → カメラ起動入口
#
# 想定: API には接続できなくても良い (loading / error / empty いずれかの状態を捕捉)。
# Android emulator 上でアプリが起動できれば最低限の screen catalog は埋まる。
appId: com.example.prephamster
---
- launchApp:
    clearState: true
# サインイン済みで始める (scripts/capture-screens.ts が scripts/dev-session.ts の deep link を渡す)
# 起動直後に開いた deep link は失われる (アプリが受け取れる前に届く)。画面が出てから開く
- extendedWaitUntil:
    visible:
      text: "Google でサインイン"
    timeout: 30000
- openLink: ${DEV_SESSION_URL}
# タブはサインイン後にだけ出る。session の設定が終わる前に撮らない
- extendedWaitUntil:
    visible:
      text: "追加"
    timeout: 15000
- takeScreenshot: home-stocks-list
- tapOn:
    text: "追加"
- waitForAnimationToEnd
- takeScreenshot: home-add-entry
