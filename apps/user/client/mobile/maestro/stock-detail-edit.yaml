# 追加 → 一覧 → 詳細 → 期限・備考の編集
#
# 前提 (consume / discard / edit / move 共通):
#   - Android 専用。画面を戻すのに Maestro の `back` (Android のみ) を使う。
#     stack の header の戻るボタンには安定した testID が無く、iOS では `back` が使えない。
#   - API がローカルで起動 (PORT 3000) し、EXPO_PUBLIC_API_BASE_URL が emulator から到達できる
#   - scripts/dev-session.ts のテストユーザーが、開いているグループの EDITOR 以上
#   - DB の状態に依存しない: 在庫ごとに実行時刻入りの barcode / 商品名 (scripts/unique-stock.js)
#     を使い、商品名のテキストでその在庫の行だけを開く。他の flow が残した在庫があってもよい
#   - 場所が 1 件以上ある
appId: com.example.prephamster
---
- launchApp:
    clearState: true
- runFlow: subflows/dev-sign-in.yaml
# タブはサインイン済みでグループがあるときだけ出る。session の設定が終わる前に進まない
- extendedWaitUntil:
    visible:
      text: "追加"
    timeout: 15000
- waitForAnimationToEnd
- runScript:
    file: scripts/unique-stock.js
    env:
      PREFIX: edit
- runFlow:
    file: subflows/add-unique-stock.yaml
    env:
      BARCODE: ${output.barcode}
      NAME: ${output.name}
      QUANTITY: "1"
# 他の在庫が残っていても、新しい在庫は期限なしで一覧の末尾に来るので画面外にあるかもしれない
- scrollUntilVisible:
    element:
      text: ${output.name}
- tapOn:
    text: ${output.name}
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-quantity"
- tapOn:
    id: "detail-use-by-input"
- inputText: "2030-01-31"
# キーボードが下の備考欄を隠すので閉じてから進む
- hideKeyboard
- tapOn:
    id: "detail-note-input"
- inputText: "maestro"
- hideKeyboard
- tapOn:
    id: "detail-edit-save"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-message"
    text: "保存しました"
- back
- waitForAnimationToEnd:
    timeout: 5000
# 一覧に戻れたことを確かめる。詳細画面にも商品名が出ているので、戻れていないと詳細のまま下の探索と判定が通る
- assertVisible:
    id: "stock-list"
# 開き直して、保存した値がサーバから返ってくること (詳細は focus のたびに API から取り直す)
# 一覧は期限の近い順なので、期限を付けたこの在庫は期限なしの在庫より上に移る。一覧は tab の中で
# 開いたままなので、戻ると詳細を開いたときの scroll 位置 (この在庫の元の位置) にいる。そこから上へ探す
- scrollUntilVisible:
    element:
      text: ${output.name}
    direction: UP
- tapOn:
    text: ${output.name}
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-use-by-input"
    text: "2030-01-31"
- assertVisible:
    id: "detail-note-input"
    text: "maestro"
