# 追加 → 一覧 → 詳細 → 期限・備考の編集
#
# 前提 (consume / discard / move 共通):
#   - API がローカルで起動 (PORT 3000) し、EXPO_PUBLIC_API_BASE_URL が emulator から到達できる
#   - API の DB は在庫 0 件の状態 (一覧の先頭行 = この flow で追加した在庫になる)
#   - EXPO_PUBLIC_STUB_USER_ID の user が EXPO_PUBLIC_STUB_GROUP_ID の EDITOR 以上
#   - 場所が 1 件以上ある
appId: com.example.prephamster
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- tapOn:
    text: "追加"
- waitForAnimationToEnd
- tapOn:
    text: "手動で barcode を入力 (debug)"
- waitForAnimationToEnd
- tapOn:
    id: "input"
- inputText: "4901234567894"
- tapOn:
    text: "送信"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "add-quantity-input"
- eraseText
- inputText: "1"
- hideKeyboard
- tapOn:
    id: "add-save"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "stock-row-.*"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-quantity"
- tapOn:
    id: "detail-use-by-input"
- inputText: "2030-01-31"
- tapOn:
    id: "detail-note-input"
- inputText: "maestro"
- hideKeyboard
- tapOn:
    id: "detail-edit-save"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-message"
    text: "保存しました"
- back
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: ".*期限 2030-01-31.*"
