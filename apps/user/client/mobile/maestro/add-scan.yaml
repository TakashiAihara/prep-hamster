# 起動 → 追加タブ → カメラ起動入口 (権限プロンプト or CameraView)
#
# emulator のカメラはバーコードを読み取れないので **permission 確認画面までで止める**。
# 実機でカメラから読む flow は別 Issue。
appId: com.example.prephamster
---
- launchApp:
    clearState: true
# サインイン済みで始める (scripts/capture-screens.ts が scripts/dev-session.ts の deep link を渡す)
- openLink: ${DEV_SESSION_URL}
# タブはサインイン後にだけ出る。session の設定が終わる前に撮らない
- extendedWaitUntil:
    visible:
      text: "追加"
    timeout: 15000
- tapOn:
    text: "追加"
- waitForAnimationToEnd
- tapOn:
    text: "カメラで読み取る"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: add-scan-permission-or-camera
