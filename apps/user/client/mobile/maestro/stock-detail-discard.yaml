# 追加 → 一覧 → 詳細 → 廃棄 (確認ダイアログ) で一覧から消える (残量 0 で買い物リスト提案)
#
# 前提 (consume / discard / edit / move 共通):
#   - Android 専用。画面を戻すのに Maestro の `back` (Android のみ) を使う。
#     stack の header の戻るボタンには安定した testID が無く、iOS では `back` が使えない。
#   - API がローカルで起動 (PORT 3000) し、EXPO_PUBLIC_API_BASE_URL が emulator から到達できる
#   - scripts/dev-session.ts のテストユーザーが、開いているグループの EDITOR 以上
#   - DB の状態に依存しない: 在庫ごとに実行時刻入りの barcode / 商品名 (scripts/unique-stock.js)
#     を使い、商品名のテキストでその在庫の行だけを開く。他の flow が残した在庫があってもよい
#   - 場所が 1 件以上ある
appId: com.example.prephamster
---
- launchApp:
    clearState: true
# サインイン済みで始める (scripts/capture-screens.ts が scripts/dev-session.ts の deep link を渡す)
# 起動直後に開いた deep link は失われる (アプリが受け取れる前に届く)。画面が出てから開く
- extendedWaitUntil:
    visible:
      text: "Google でサインイン"
    timeout: 30000
- openLink: ${DEV_SESSION_URL}
# タブはサインイン済みでグループがあるときだけ出る。session の設定が終わる前に進まない
- extendedWaitUntil:
    visible:
      text: "追加"
    timeout: 15000
- waitForAnimationToEnd
- runScript:
    file: scripts/unique-stock.js
    env:
      PREFIX: discard
- runFlow:
    file: subflows/add-unique-stock.yaml
    env:
      BARCODE: ${output.barcode}
      NAME: ${output.name}
      QUANTITY: "1"
# 他の在庫が残っていても、新しい在庫は期限なしで一覧の末尾に来るので画面外にあるかもしれない
- scrollUntilVisible:
    element:
      text: ${output.name}
- tapOn:
    text: ${output.name}
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "detail-quantity"
- tapOn:
    id: "detail-reason-input"
# Maestro は Android で ASCII 以外を入力できない (mobile-dev-inc/maestro#146)
- inputText: "expired"
- hideKeyboard
- tapOn:
    id: "detail-discard"
- tapOn:
    text: "廃棄する"
- waitForAnimationToEnd:
    timeout: 5000
# 残量 0 なので留まって提案を出す
- assertVisible:
    id: "detail-shopping-suggestion"
- takeScreenshot: stock-detail-shopping-suggestion
- back
- waitForAnimationToEnd:
    timeout: 5000
# 一覧が描画されていること (エラー / 読み込み中ではないこと) を確かめてから、この在庫の行だけが無いことを見る
- assertVisible:
    id: "stock-list|stock-list-empty"
# notVisible だけでは行が画面外にあっても通るので、一覧を上下の端まで送って探してから見る。
# 行が残っていればこの scroll で画面に出て、最後の assertNotVisible で落ちる
- runFlow:
    when:
      visible:
        id: "stock-list"
    commands:
      - scrollUntilVisible:
          element:
            text: ${output.name}
          direction: UP
          timeout: 10000
          optional: true
      - scrollUntilVisible:
          element:
            text: ${output.name}
          direction: DOWN
          timeout: 20000
          optional: true
- assertNotVisible:
    text: ${output.name}
